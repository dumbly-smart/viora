name: Android

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          gradle-version: "9.5.0"
      - name: Unit tests, instrumentation compile, and lint
        run: gradle testDebugUnitTest assembleDebug assembleDebugAndroidTest lintDebug --stacktrace
      - name: Validate automation scripts
        run: |
          sh -n scripts/*.sh
          scripts/privacy-audit.sh
          scripts/validate-release-version.sh 0.1.0 1 >/dev/null
          ! scripts/validate-release-version.sh 1.0 1 >/dev/null 2>&1
          ! scripts/validate-release-version.sh 0.1.0 0 >/dev/null 2>&1
