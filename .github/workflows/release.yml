name: Signed APK release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version_name:
        description: Version name, for example 0.2.0
        required: true
      version_code:
        description: Monotonically increasing Android version code
        required: true

permissions:
  contents: write

jobs:
  signed-apk:
    runs-on: ubuntu-latest
    env:
      VIORA_KEYSTORE_PASSWORD: ${{ secrets.VIORA_KEYSTORE_PASSWORD }}
      VIORA_KEY_ALIAS: ${{ secrets.VIORA_KEY_ALIAS }}
      VIORA_KEY_PASSWORD: ${{ secrets.VIORA_KEY_PASSWORD }}
      VIORA_CERT_SHA256: ${{ secrets.VIORA_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.5.0"
      - name: Resolve release version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "VIORA_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
            echo "VIORA_VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          else
            echo "VIORA_VERSION_NAME=${{ inputs.version_name }}" >> "$GITHUB_ENV"
            echo "VIORA_VERSION_CODE=${{ inputs.version_code }}" >> "$GITHUB_ENV"
          fi
      - name: Provision signing key
        shell: bash
        env:
          VIORA_KEYSTORE_BASE64: ${{ secrets.VIORA_KEYSTORE_BASE64 }}
        run: |
          test -n "$VIORA_KEYSTORE_BASE64"
          test -n "$VIORA_KEYSTORE_PASSWORD"
          test -n "$VIORA_KEY_ALIAS"
          test -n "$VIORA_KEY_PASSWORD"
          test -n "$VIORA_CERT_SHA256"
          keystore="$RUNNER_TEMP/viora-release.jks"
          printf '%s' "$VIORA_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          echo "VIORA_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"
      - name: Test and build signed release APK
        run: gradle testDebugUnitTest lintRelease assembleRelease --stacktrace
      - name: Verify signature, alignment, and checksum
        shell: bash
        run: |
          source_apk="app/build/outputs/apk/release/app-release.apk"
          release_apk="app/build/outputs/apk/release/Viora-${VIORA_VERSION_NAME}.apk"
          mv "$source_apk" "$release_apk"
          scripts/verify-release-apk.sh "$release_apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Viora-${{ env.VIORA_VERSION_NAME }}-signed
          path: |
            app/build/outputs/apk/release/Viora-${{ env.VIORA_VERSION_NAME }}.apk
            app/build/outputs/apk/release/Viora-${{ env.VIORA_VERSION_NAME }}.apk.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Publish tagged GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" app/build/outputs/apk/release/Viora-${VIORA_VERSION_NAME}.apk app/build/outputs/apk/release/Viora-${VIORA_VERSION_NAME}.apk.sha256 --generate-notes
